<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Accessible contact form for Your Name.">
<title>Contact | Your Name</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><nav class="container" aria-label="Main navigation">
<a class="logo" href="index.html">My Portfolio</a>
<ul class="nav-list">
<li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li>
<li><a href="projects.html">Projects</a></li><li><a href="contact.html" aria-current="page">Contact</a></li>
</ul></nav></header>
<main class="container section">
<section aria-labelledby="contact-title">
<h1 id="contact-title">Contact Me</h1>
<form class="contact-form" action="#" method="post" aria-describedby="form-help">
<p id="form-help">Fields marked with * are required.</p>
<div class="form-group"><label for="name">Name *</label><input id="name" name="name" type="text" autocomplete="name" required></div>
<div class="form-group"><label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<div class="form-group"><label for="message">Message *</label><textarea id="message" name="message" rows="6" required></textarea></div>
<button class="button" type="submit">Send Message</button>
</form>
</section>
</main>
<footer class="site-footer"><p>&copy; 2026 Your Name. All rights reserved.</p></footer>
</body>
</html>
