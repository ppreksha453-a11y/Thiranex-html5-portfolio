<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - To-Do Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header class="header">
<div><p class="eyebrow">TASK MANAGEMENT</p><h1>TaskFlow</h1><p class="subtitle">Organize your day, one task at a time.</p></div>
<div class="stats"><strong id="taskCount">0</strong><span>Tasks</span></div>
</header>

<section class="composer">
<input id="taskInput" type="text" placeholder="What needs to be done?" maxlength="120" autocomplete="off">
<button id="addTask" type="button">Add Task</button>
</section>

<section class="toolbar">
<div class="filters" id="filters">
<button class="filter active" data-filter="all">All</button>
<button class="filter" data-filter="active">Active</button>
<button class="filter" data-filter="completed">Completed</button>
</div>
<button id="clearCompleted" class="clear-btn" type="button">Clear completed</button>
</section>

<ul id="taskList" class="task-list" aria-live="polite"></ul>
<div id="emptyState" class="empty"><div class="empty-icon">✓</div><h2>No tasks here</h2><p>Add a task above to get started.</p></div>
</main>
<footer>TaskFlow • Data is saved automatically in your browser</footer>
<script src="script.js"></script>
</body>
</html>
